name: 'ecommerce_transform'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_profile'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
- "target"
- "dbt_packages"

models:
  ecommerce_transform:
    +pre-hook: "SET SESSION sql_require_primary_key = 0;"
  # Mặc định tạo dưới dạng VIEW hoặc TABLE trong database
    staging:
      +materialized: view
    marts:
      +materialized: table
